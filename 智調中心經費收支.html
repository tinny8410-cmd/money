<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智調中心 經費收支</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF3EF;
  --sheet: #FAFCFA;
  --field: #FFFFFF;
  --rule: #D2E1D5;
  --rule-strong: #8DB098;
  --ink: #1C2A23;
  --ink-soft: #55675C;
  --ink-faint: #85958B;
  --hover: #E6EFE8;
  --income: #1B6A4A;
  --expense: #A5362A;
  --seal: #BC2F26;
  --accent: #2A4B7C;
  --accent-ink: #FFFFFF;
  --warn: #8E5C10;
  --tint-inc: #E3F0E8;
  --tint-exp: #F7E4E0;
  --backdrop: rgba(18, 28, 23, .45);
  --font-ui: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121916; --sheet: #18211D; --field: #0F1512; --rule: #2B3A33; --rule-strong: #4C6B5A;
    --ink: #E2EBE5; --ink-soft: #A2B4A9; --ink-faint: #74877C; --hover: #1F2B26;
    --income: #63C195; --expense: #F0806F; --seal: #F06A5B; --accent: #93B6EC; --accent-ink: #0F1A2B;
    --warn: #E3AC52; --tint-inc: #1C3329; --tint-exp: #3A2220; --backdrop: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121916; --sheet: #18211D; --field: #0F1512; --rule: #2B3A33; --rule-strong: #4C6B5A;
  --ink: #E2EBE5; --ink-soft: #A2B4A9; --ink-faint: #74877C; --hover: #1F2B26;
  --income: #63C195; --expense: #F0806F; --seal: #F06A5B; --accent: #93B6EC; --accent-ink: #0F1A2B;
  --warn: #E3AC52; --tint-inc: #1C3329; --tint-exp: #3A2220; --backdrop: rgba(0,0,0,.6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
h2 { font-family: var(--font-hand); font-weight: 700; font-size: 19px; letter-spacing: .02em; }
.grow { flex: 1 1 auto; }
.muted { color: var(--ink-soft); }
.c-income { color: var(--income); }
.c-expense { color: var(--expense); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px 0; }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo-seal { flex: 0 0 auto; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-hand); font-weight: 700; color: var(--seal); border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 2px; border-radius: 4px; font-size: 14px; line-height: 1.08; padding: 3px 4px; transform: rotate(-3deg); user-select: none; }
.logo-seal span { display: block; }
h1 { font-family: var(--font-hand); font-weight: 700; font-size: 26px; letter-spacing: .03em; line-height: 1.2; }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; border: 0; background: none; padding: 8px 12px 10px; font: inherit; color: var(--ink-soft); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* controls */
.btn { font: inherit; font-weight: 500; border-radius: 5px; padding: 7px 14px; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); cursor: pointer; min-height: 38px; line-height: 1.4; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--expense); border-color: var(--expense); background: transparent; }
.btn.danger-fill { background: var(--expense); border-color: var(--expense); color: var(--sheet); }
.btn.small { padding: 4px 10px; min-height: 32px; font-size: 14px; }
.btn:disabled { opacity: .55; cursor: default; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule-strong); border-radius: 5px; padding: 6px 10px; min-height: 38px; max-width: 100%; }
textarea { resize: vertical; min-height: 60px; }
input:disabled, select:disabled, textarea:disabled { opacity: .75; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* layout */
main { max-width: 1120px; margin: 0 auto; padding: 22px 24px 64px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 26px 26px; }
.notice { border: 1px solid var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
.loading { color: var(--ink-soft); padding: 28px 0; }
.block { margin-top: 30px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 8px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 36px; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* settlement line */
.settle { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.settle > div { padding: 12px 16px 14px; text-align: right; border-left: 1px solid var(--rule); min-width: 0; }
.settle > div:first-child { border-left: 0; padding-left: 0; }
.settle .lbl { display: block; font-family: var(--font-hand); font-size: 16px; color: var(--ink-soft); }
.settle .num { font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
.settle .balance u { text-decoration: none; border-bottom: 3px double currentColor; padding-bottom: 1px; }
.settle-note { margin: 8px 0 0; font-size: 13px; color: var(--ink-faint); }
.pending { display: flex; gap: 8px 22px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--ink-soft); }
@media (max-width: 560px) {
  .settle { grid-template-columns: minmax(0, 1fr); }
  .settle > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-left: 0; border-top: 1px solid var(--rule); padding: 10px 0; }
  .settle > div:first-child { border-top: 0; }
  .settle .num { font-size: 22px; }
}

/* chart */
.legend { font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; margin-left: 8px; }
.sw.inc { background: var(--income); } .sw.exp { background: var(--expense); }
.chart-scroll { overflow-x: auto; }
svg.chart { display: block; width: 100%; min-width: 640px; height: auto; }
svg.chart .g { stroke: var(--rule); stroke-width: 1; }
svg.chart .base { stroke: var(--ink-soft); stroke-width: 1; }
svg.chart .ax { fill: var(--ink-faint); font-size: 12px; font-family: var(--font-ui); }
svg.chart .bi { fill: var(--income); }
svg.chart .be { fill: var(--expense); }
svg.chart .hit { fill: transparent; }
svg.chart g:hover .hit { fill: var(--hover); }

/* projects (compact + full) */
.bar { position: relative; display: block; height: 8px; background: var(--rule); border-radius: 1px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 1px; }
.bar.near .fill { background: var(--warn); }
.bar.over .fill { background: var(--expense); }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.flag { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 3px; margin-left: 6px; }
.flag.over { color: var(--expense); border: 1px solid currentColor; }
.flag.lag { color: var(--warn); border: 1px solid currentColor; }
.proj-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) 7.5em; gap: 6px 16px; align-items: center; border-bottom: 1px solid var(--rule); padding: 12px 4px; }
.proj-row .p-name { display: block; font: inherit; font-weight: 500; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
.proj-row .p-name:hover { text-decoration-color: currentColor; }
.p-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn.tiny { padding: 2px 10px; min-height: 30px; font-size: 13.5px; }
.btn.add-inc { color: var(--income); border-color: var(--income); background: transparent; }
.btn.add-inc:hover { background: var(--tint-inc); }
.btn.add-exp { color: var(--expense); border-color: var(--expense); background: transparent; }
.btn.add-exp:hover { background: var(--tint-exp); }
.proj-row .p-note { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
.proj-row .p-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.proj-row .p-num small { display: block; font-size: 12px; color: var(--ink-faint); }
@media (max-width: 560px) { .proj-row { grid-template-columns: minmax(0, 1fr) 7.5em; } .proj-row .p-exec { grid-column: 1 / -1; grid-row: 2; } }

.cats { list-style: none; margin: 0; padding: 0; }
.cats button { display: grid; grid-template-columns: minmax(5em, 8em) minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 4px; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cats button:hover { background: var(--hover); }
.c-name { overflow-wrap: anywhere; }
.c-bar { display: block; height: 6px; background: var(--rule); }
.c-bar span { display: block; height: 100%; background: var(--expense); }
.c-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-val small { color: var(--ink-faint); margin-left: 6px; font-size: 12px; }

.empty { padding: 36px 0 20px; max-width: 34em; }
.empty p { color: var(--ink-soft); margin: 10px 0 18px; }
.empty-act { display: flex; gap: 10px; flex-wrap: wrap; }

/* ledger */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { flex: 0 1 auto; max-width: 14em; }
.filters input[type="search"] { flex: 1 1 200px; min-width: 160px; }
@media (max-width: 560px) {
  .filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filters select { max-width: none; width: 100%; }
  .filters input[type="search"] { grid-column: 1 / -1; min-width: 0; }
  .filters .btn { grid-column: 1 / -1; }
}
.lsum { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin: 16px 0 6px; font-size: 14px; color: var(--ink-soft); }
.table-wrap { overflow-x: auto; }
.ledger { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 680px; }
.ledger th { text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 13px; padding: 8px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.ledger th.num, .ledger td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.ledger td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ledger tr.row { cursor: pointer; }
.ledger tr.row:hover { background: var(--hover); }
.ledger td.c-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.ledger td.c-cat { color: var(--ink-soft); white-space: nowrap; }
.ledger .sum { overflow-wrap: anywhere; }
.ledger .sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
.ledger td.c-inc, .ledger td.c-exp { font-weight: 500; }
.ledger tfoot td { font-weight: 600; padding: 9px 10px; }
.ledger tfoot tr.tot td { border-top: 1px solid var(--ink); border-bottom: 0; }
.ledger tfoot tr.net td { border-bottom: 3px double var(--ink); color: var(--ink-soft); font-weight: 500; }
.ledger tfoot tr.net td.num { color: var(--ink); font-weight: 600; }
.more { margin-top: 14px; }
@media (max-width: 960px) { .ledger .c-vou { display: none; } }
@media (max-width: 720px) {
  .ledger { min-width: 0; }
  .ledger thead { display: none; }
  .ledger, .ledger tbody, .ledger tfoot { display: block; }
  .ledger tr.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "date cat st" "sum sum amt"; gap: 3px 10px; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
  .ledger tr.row td { border: 0; padding: 0; }
  .ledger td.c-date { grid-area: date; font-size: 13px; }
  .ledger td.c-cat { grid-area: cat; font-size: 13px; }
  .ledger td.c-st { grid-area: st; justify-self: end; }
  .ledger td.c-sum { grid-area: sum; }
  .ledger td.c-inc, .ledger td.c-exp { grid-area: amt; align-self: end; font-size: 15px; }
  .ledger td.empty, .ledger td.c-hand, .ledger td.c-vou { display: none; }
  .ledger tfoot { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); }
  .ledger tfoot tr { display: flex; justify-content: space-between; gap: 12px; padding: 8px 2px 0; }
  .ledger tfoot tr.net { padding-bottom: 8px; }
  .ledger tfoot td { border: 0 !important; padding: 0; }
  .ledger tfoot td:first-child { margin-right: auto; }
}

/* statuses */
.seal { display: inline-block; font-family: var(--font-hand); font-weight: 700; font-size: 13px; line-height: 1.35; color: var(--seal); border: 1.5px solid currentColor; outline: 1px solid currentColor; outline-offset: 1.5px; padding: 0 5px; border-radius: 3px; letter-spacing: .08em; transform: rotate(var(--r, -4deg)); opacity: .9; white-space: nowrap; margin: 2px 0; }
.st-open { font-size: 13px; color: var(--warn); white-space: nowrap; }
.st-proc { font-size: 13px; color: var(--accent); white-space: nowrap; }

/* monthly fixed expenses */
.due { border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 10px 16px 6px; margin-top: 16px; }
.due-title { font-family: var(--font-hand); font-weight: 700; font-size: 17px; margin: 0 0 2px; }
.due-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 0; border-top: 1px solid var(--rule); }
.due-title + .due-row { border-top: 0; }
.due-text { flex: 1 1 260px; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.due-text strong { font-weight: 600; }
.due-act { display: flex; gap: 6px; flex-wrap: wrap; }
.rec-line { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
.rec-line .warn { color: var(--warn); }
.rec-rule { border: 1px solid var(--rule); border-radius: 6px; padding: 10px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.rec-rule input, .rec-rule select { min-height: 34px; padding: 4px 8px; min-width: 0; width: 100%; }
.rec-rule .r2 { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13.5px; color: var(--ink-soft); }
#pRec .rec-rule .r2 input { width: 11.5em; }
#pRec .rec-rule .r2 select { width: auto; }
.rec-rule .r-err { grid-column: 1 / -1; margin: 0; }
@media (max-width: 560px) { .rec-rule { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; } .rec-rule .r-sum { grid-column: 1 / -2; } }

/* projects view */
.pv-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink-soft); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.pv-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1.3fr) auto; gap: 14px 22px; padding: 18px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.pv-row h3 { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.pv-sub { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.closed-tag { display: inline-block; font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0 6px; margin-top: 6px; }
.pv-figs { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; font-size: 14px; }
.pv-figs dt { color: var(--ink-soft); }
.pv-figs dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.pv-exec .bar { margin-top: 8px; }
.pv-note { margin: 8px 0 0; font-size: 13px; color: var(--ink-soft); }
.pv-act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 860px) { .pv-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .pv-act { justify-content: flex-start; } }
@media (max-width: 560px) { .pv-row { grid-template-columns: minmax(0, 1fr); } }

/* settings */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
.set-grid .block { margin-top: 26px; }
.set-grid .block:nth-child(-n+2) { margin-top: 0; }
@media (max-width: 760px) { .set-grid { grid-template-columns: minmax(0, 1fr); } .set-grid .block:nth-child(2) { margin-top: 26px; } }
.field { min-width: 0; }
.field > label, .flabel { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
.field input:not([type="radio"]):not([type="checkbox"]), .field select, .field textarea { width: 100%; }
.stack > * + * { margin-top: 12px; }
.radio-line { display: flex; flex-direction: column; gap: 6px; }
.radio-line label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.radio-line input { min-height: 0; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 4px 3px 10px; font-size: 14px; }
.chip-x { border: 0; background: none; color: var(--ink-faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
.chip-x:hover { color: var(--expense); background: var(--hover); }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1 1 auto; min-width: 0; }
.help { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; }

/* dialogs */
dialog { border: 1px solid var(--rule-strong); border-radius: 8px; padding: 0; width: min(580px, calc(100vw - 20px)); max-height: calc(100dvh - 24px); background: var(--sheet); color: var(--ink); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: var(--backdrop); }
dialog form { display: flex; flex-direction: column; min-height: 0; max-height: inherit; }
.dlg-head { padding: 18px 22px 12px; border-bottom: 1px solid var(--rule); }
.dlg-head h2 { font-size: 20px; }
.dlg-meta { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-faint); }
.dlg-body { padding: 16px 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 16px; overflow: auto; flex: 1 1 auto; min-height: 0; }
.dlg-body .full { grid-column: 1 / -1; }
.dlg-foot { padding: 12px 22px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); }
.flash { font-size: 13px; color: var(--income); }
.flash.bad { color: var(--expense); }
.err { color: var(--expense); font-size: 12.5px; margin-top: 3px; min-height: 0; }

#eAmount { font-size: 20px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.rchip { position: relative; }
.rchip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; min-height: 0; }

.rchip input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-weight: 600; }
.rchip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
#confirmDlg { width: min(440px, calc(100vw - 20px)); }
#confirmDlg p { margin: 0; padding: 20px 22px 8px; }
#confirmDlg .dlg-foot { border-top: 0; justify-content: flex-end; }
@media (max-width: 560px) { .dlg-body { grid-template-columns: minmax(0, 1fr); } .top-inner { padding: 12px 16px 0; } main { padding: 16px 12px 56px; } .sheet { padding: 16px 14px 20px; } h1 { font-size: 22px; } }

/* toast */
.toast-wrap { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; z-index: 50; }

<body>
<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <span class="logo-seal" id="logoSeal" aria-hidden="true"><span>智</span><span>調</span></span>
      <h1 id="title">智調中心 經費收支</h1>
      <span class="grow"></span>
      <select id="period" aria-label="期間"></select>
      <button class="btn primary" id="addBtn" type="button" hidden>記一筆</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="頁面">
      <button class="tab" role="tab" type="button" data-view="overview" id="tab-overview" aria-controls="view-overview" aria-selected="true">總覽</button>
      <button class="tab" role="tab" type="button" data-view="ledger" id="tab-ledger" aria-controls="view-ledger" aria-selected="false">收支明細</button>
      <button class="tab" role="tab" type="button" data-view="projects" id="tab-projects" aria-controls="view-projects" aria-selected="false">計畫預算</button>
      <button class="tab" role="tab" type="button" data-view="settings" id="tab-settings" aria-controls="view-settings" aria-selected="false">設定</button>
    </nav>
  </div>
</header>

<main>
  <div id="notice" class="notice" role="status" hidden></div>

  <section id="view-overview" class="view" role="tabpanel" aria-labelledby="tab-overview">
    <div class="sheet" id="ov"><p class="loading">正在讀取資料…</p></div>
  </section>

  <section id="view-ledger" class="view" role="tabpanel" aria-labelledby="tab-ledger" hidden>
    <div class="sheet">
      <div class="filters">
        <select id="fType" aria-label="類型">
          <option value="all">收入與支出</option>
          <option value="income">只看收入</option>
          <option value="expense">只看支出</option>

        <select id="fProject" aria-label="計畫"></select>
        <select id="fCat" aria-label="科目"></select>
        <select id="fStatus" aria-label="狀態">
          <option value="all">所有狀態</option>
          <option value="open">尚未完成</option>
          <optgroup label="支出">
            <option value="x:unsubmitted">未送件</option>
            <option value="x:processing">核銷中</option>
            <option value="x:done">已核銷</option>
          </optgroup>
          <optgroup label="收入">
            <option value="i:pending">待入帳</option>
            <option value="i:done">已入帳</option>
          </optgroup>
        </select>
        <input id="fQ" type="search" placeholder="搜尋摘要、經手人、憑證編號" aria-label="搜尋">
        <button id="exportBtn" class="btn" type="button" hidden>匯出 CSV</button>
      </div>
      <div id="ledgerSum" class="lsum"></div>
      <div class="table-wrap" id="ledgerWrap">
        <table class="ledger" id="ledgerTable">
          <thead>
            <tr>
              <th><button type="button" id="sortBtn">日期 ↓</button></th>
              <th>科目</th>
              <th>摘要</th>
              <th class="c-hand">經手人</th>
              <th class="c-vou">憑證編號</th>
              <th>狀態</th>
              <th class="num">收入</th>
              <th class="num">支出</th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
          <tfoot id="ledgerFoot"></tfoot>
        </table>
      </div>
      <div id="ledgerEmpty"></div>
      <div class="more" id="moreWrap" hidden><button class="btn" type="button" id="moreBtn">再顯示 200 筆</button></div>
    </div>
  </section>

  <section id="view-projects" class="view" role="tabpanel" aria-labelledby="tab-projects" hidden>
    <div class="sheet">
      <div class="pv-tools">
        <div class="seg" role="group" aria-label="計畫狀態">
          <button type="button" data-pf="active" aria-pressed="true">執行中</button>
          <button type="button" data-pf="closed" aria-pressed="false">已結案</button>
          <button type="button" data-pf="all" aria-pressed="false">全部</button>
        </div>
        <span class="grow"></span>
        <button class="btn primary" type="button" id="addProj" hidden>新增計畫</button>
      </div>
      <p class="help">藍色長條是經費執行率，黑色刻線是計畫期間已經過了多少。刻線跑在長條前面很多，代表經費用得比時間慢。</p>
      <div id="projList"></div>
    </div>

  <section id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <div class="sheet">
      <div class="set-grid">
        <section class="block">
          <div class="block-head"><h2>中心資料</h2></div>

            <div class="field"><label for="sName">中心名稱</label><input id="sName" maxlength="30" autocomplete="off"></div>
            <div class="field">
              <span class="flabel">年度怎麼算</span>
              <div class="radio-line">
                <label><input type="radio" name="sFiscal" value="1"> 曆年制，1 月到 12 月</label>
                <label><input type="radio" name="sFiscal" value="8"> 學年度制，8 月到隔年 7 月</label>
              </div>
            </div>
            <div><button class="btn primary" type="button" id="saveBasics">儲存</button></div>
          </fieldset>
        </section>
        <section class="block">
          <div class="block-head"><h2>資料與分享</h2></div>
          <p class="help" id="dataInfo"></p>
          <div class="field" style="margin-top:16px">
            <span class="flabel">日期顯示（只影響這台電腦）</span>
            <div class="radio-line">
              <label><input type="radio" name="sDate" value="roc"> 民國年，例如 115/09/30</label>
              <label><input type="radio" name="sDate" value="ad"> 西元年，例如 2026/09/30</label>
            </div>
          </div>
        </section>
        <section class="block">
          <div class="block-head"><h2>收入科目</h2></div>
          <div class="chips" id="incCats"></div>
          <div class="add-row" id="incAddRow"><input id="incNew" maxlength="20" placeholder="新增收入科目" aria-label="新增收入科目"><button class="btn" type="button" data-action="add-cat" data-kind="income">新增</button></div>
        </section>
        <section class="block">
          <div class="block-head"><h2>支出科目</h2></div>
          <div class="chips" id="expCats"></div>
          <div class="add-row" id="expAddRow"><input id="expNew" maxlength="20" placeholder="新增支出科目" aria-label="新增支出科目"><button class="btn" type="button" data-action="add-cat" data-kind="expense">新增</button></div>
        </section>
      </div>
      <p class="help" style="margin-top:22px">移除科目只會讓它從選單消失，已經記下的紀錄會保留原本的科目名稱。</p>
    </div>
  </section>
</main>

<dialog id="entryDlg" aria-labelledby="entryTitle">
  <form id="entryForm" novalidate>
    <div class="dlg-head">
      <h2 id="entryTitle">記一筆</h2>
      <p class="dlg-meta" id="entryMeta"></p>
    </div>
    <fieldset class="dlg-body" id="eFields">
      <div class="field full">
        <div class="typeseg" role="group" aria-label="類型">
          <button type="button" data-t="income" aria-pressed="false">收入</button>
          <button type="button" data-t="expense" aria-pressed="true">支出</button>
        </div>
      </div>
      <div class="field"><label for="eDate">日期</label><input id="eDate" type="date"><div class="err" id="eDateErr"></div></div>
      <div class="field"><label for="eAmount">金額（元）</label><input id="eAmount" inputmode="numeric" autocomplete="off"><div class="err" id="eAmountErr"></div></div>
      <div class="field"><label for="eCat">科目</label><select id="eCat"></select></div>
      <div class="field"><label for="eProject">計畫</label><select id="eProject"></select></div>
      <div class="field full"><label for="eSummary">摘要</label><input id="eSummary" maxlength="120" autocomplete="off" placeholder="例如：9 月電訪訪員費"><div class="err" id="eSummaryErr"></div></div>
      <div class="field"><label for="eHandler">經手人</label><input id="eHandler" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="eVoucher">憑證編號</label><input id="eVoucher" maxlength="40" autocomplete="off" placeholder="發票或收據號碼"></div>
      <div class="field full"><span class="flabel" id="eStatusLbl">核銷狀態</span><div class="radios" id="eStatus" role="radiogroup" aria-labelledby="eStatusLbl"></div></div>

      <button type="button" class="btn" id="eCancel">取消</button>

</dialog>

<dialog id="projDlg" aria-labelledby="projTitle">
  <form id="projForm" novalidate>
    <div class="dlg-head"><h2 id="projTitle">新增計畫</h2></div>
    <fieldset class="dlg-body" id="pFields">
      <div class="field full"><label for="pName">計畫名稱</label><input id="pName" maxlength="120" autocomplete="off"><div class="err" id="pNameErr"></div></div>
      <div class="field"><label for="pCode">計畫編號</label><input id="pCode" maxlength="60" autocomplete="off"></div>
      <div class="field"><label for="pSponsor">委託或補助單位</label><input id="pSponsor" maxlength="120" autocomplete="off"></div>
      <div class="field"><label for="pBudget">核定經費（元）</label><input id="pBudget" inputmode="numeric" autocomplete="off"><div class="err" id="pBudgetErr"></div></div>
      <div class="field"><label for="pStatus">狀態</label><select id="pStatus"><option value="active">執行中</option><option value="closed">已結案</option></select></div>
      <div class="field"><label for="pStart">開始日期</label><input id="pStart" type="date"></div>
      <div class="field"><label for="pEnd">結束日期</label><input id="pEnd" type="date"><div class="err" id="pEndErr"></div></div>
      <div class="field full"><label for="pNote">備註</label><textarea id="pNote" rows="2" maxlength="500"></textarea></div>

<dialog id="confirmDlg" aria-labelledby="confirmMsg">

  <div class="dlg-foot">
    <button type="button" class="btn" id="cNo">取消</button>

</dialog>

<div class="toast-wrap"><div id="toast" class="toast" role="status" aria-live="polite"></div></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const DEFAULTS = {
  centerName: '智調中心',
  fiscalStart: 1,
  incomeCats: ['委託計畫收入', '政府補助款', '學校撥款', '調查服務收入', '研習課程收入', '其他收入'],
  expenseCats: ['人事費', '訪員費', '工讀費', '出席費／審查費', '受訪者禮品', '印刷費', '文具耗材', '郵電費', '差旅費', '軟體及資料庫', '設備費', '管理費', '雜支']
};
const STATUS = {
  expense: [{ v: 'unsubmitted', t: '未送件' }, { v: 'processing', t: '核銷中' }, { v: 'done', t: '已核銷' }],
  income: [{ v: 'pending', t: '待入帳' }, { v: 'done', t: '已入帳' }]
};
const STATUS_TEXT = { expense: { unsubmitted: '未送件', processing: '核銷中', done: '已核銷' }, income: { pending: '待入帳', done: '已入帳' } };
const LKEY = 'zhidiao-ledger-v1';
const PREF_DATE = 'zhidiao-date-style';
const PAGE = 200;
const MSG_LOCAL = '目前連不上共用資料庫，資料只會存在這台電腦的瀏覽器裡。換電腦或清除瀏覽資料就會看不到，同事也看不到。';
const MSG_RO = '你目前只能檢視，不能新增或修改資料。需要一起記帳的話，請頁面擁有者把你的權限調成可以編輯。';

/* ---------- state ---------- */
const S = {
  mode: 'loading',
  entries: [], projects: [], settingsDoc: null,
  loaded: { entries: false, projects: false, settings: false },
  canWrite: true,
  myId: null,
  view: 'overview',
  period: null,
  filters: { type: 'all', project: 'all', category: 'all', status: 'all', q: '' },
  sortAsc: false,
  limit: PAGE,
  projFilter: 'active',
  dateStyle: 'roc'
};
let DB = null, USER = null, DL = null;
const LOCAL = { entries: {}, projects: {}, settings: null };
let unsubs = [];

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const money = n => nf.format(Math.round(Number(n) || 0));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const str = (v, max = 500) => typeof v === 'string' ? v.slice(0, max) : '';
const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const validMonth = s => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const byName = (a, b) => a.name.localeCompare(b.name, 'zh-Hant');
const pct = r => Math.round(r * 100) + '%';
function localDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return localDateStr(new Date()); }
function fmtDate(s) {
  if (!validDate(s)) return s || '';
  const [y, m, d] = s.split('-');
  return S.dateStyle === 'roc' ? `${Number(y) - 1911}/${m}/${d}` : `${y}/${m}/${d}`;
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return fmtDate(localDateStr(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fyOf(dateStr, start) {
  const y = Number(dateStr.slice(0, 4)), m = Number(dateStr.slice(5, 7));
  return start === 1 ? y : (m >= start ? y : y - 1);
}
function fyLabel(fy, start) {
  return start === 1 ? `${fy - 1911} 年度（${fy}）` : `${fy - 1911} 學年度（${fy}/8 到 ${fy + 1}/7）`;
}
function fyRange(fy, start) {
  const endY = start === 1 ? fy : fy + 1;
  const endM = start === 1 ? 12 : start - 1;
  const last = new Date(endY, endM, 0).getDate();
  return [`${fy}-${pad(start)}-01`, `${endY}-${pad(endM)}-${pad(last)}`];
}
function parseAmount(v, allowZero) {
  const t = String(v == null ? '' : v).replace(/[\s,，元]/g, '').replace(/^NT\$?/i, '').replace(/^\$/, '');
  if (!/^\d+(\.0+)?$/.test(t)) return null;
  const n = Math.round(Number(t));
  if (!isFinite(n) || n >= 1e12) return null;
  if (n === 0 && !allowZero) return null;
  return n;
}

/* ---------- normalization (shared data is untrusted) ---------- */
function normEntry(id, d) {
  d = d || {};
  const type = d.type === 'income' ? 'income' : 'expense';
  let amount = Number(d.amount);
  if (!isFinite(amount) || amount < 0) amount = 0;
  let status = str(d.status, 20);
  if (!Object.prototype.hasOwnProperty.call(STATUS_TEXT[type], status)) status = type === 'income' ? 'done' : 'unsubmitted';
  return {
    id, type, amount, status,
    date: validDate(d.date) ? d.date : '',
    projectId: str(d.projectId, 200),
    category: str(d.category, 40),
    summary: str(d.summary, 200),
    handler: str(d.handler, 60),
    voucherNo: str(d.voucherNo, 60),
    note: str(d.note, 1000),
    createdBy: str(d.createdBy, 200) || null,
    createdAt: str(d.createdAt, 40),
    updatedBy: str(d.updatedBy, 200) || null,
    updatedAt: str(d.updatedAt, 40)
  };
}
function normProject(id, d) {
  d = d || {};
  let budget = Number(d.budget);
  if (!isFinite(budget) || budget < 0) budget = 0;
  return {
    id, budget,
    name: str(d.name, 120) || '（未命名計畫）',
    code: str(d.code, 60),
    sponsor: str(d.sponsor, 120),
    start: validDate(d.start) ? d.start : '',
    end: validDate(d.end) ? d.end : '',
    status: d.status === 'closed' ? 'closed' : 'active',
    note: str(d.note, 1000),
    recurring: Array.isArray(d.recurring) ? d.recurring.slice(0, 12).map(normRule).filter(Boolean) : [],
    createdBy: str(d.createdBy, 200) || null,
    createdAt: str(d.createdAt, 40),
    updatedAt: str(d.updatedAt, 40)
  };
}
function normRule(r) {
  if (!r || typeof r !== 'object') return null;
  const id = str(r.id, 60);
  if (!/^[A-Za-z0-9_.~:@+-]+$/.test(id) || !validMonth(r.start)) return null;
  const amount = Number(r.amount);
  return {
    id,
    summary: str(r.summary, 30) || '固定支出',
    category: str(r.category, 20) || '雜支',
    amount: isFinite(amount) && amount > 0 ? Math.round(amount) : 0,
    start: r.start,
    end: validMonth(r.end) ? r.end : '',
    status: hasOwn(STATUS_TEXT.expense, r.status) ? r.status : 'unsubmitted',
    doneMonths: Array.isArray(r.doneMonths) ? r.doneMonths.filter(validMonth).slice(-240) : []
  };
}
function projectBody(p) {
  return {
    name: p.name, budget: p.budget, code: p.code, sponsor: p.sponsor, status: p.status,
    start: p.start, end: p.end, note: p.note,
    recurring: (p.recurring || []).map(r => ({ id: r.id, summary: r.summary, category: r.category, amount: r.amount, start: r.start, end: r.end, status: r.status, doneMonths: r.doneMonths.slice() })),
    createdBy: p.createdBy || null,
    createdAt: p.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
}
function settings() {
  const d = S.settingsDoc || {};
  const cats = (a, def) => {
    if (!Array.isArray(a)) return def.slice();
    const out = [];
    for (const x of a) {
      if (typeof x !== 'string') continue;
      const t = x.trim().slice(0, 20);
      if (t && !out.includes(t)) out.push(t);
    }
    return out.length ? out : def.slice();
  };
  return {
    centerName: str(d.centerName, 30).trim() || DEFAULTS.centerName,

function matchStatus(e, f) {
  if (f === 'all') return true;
  if (f === 'open') return e.status !== 'done';
  const [k, v] = f.split(':');
  return (k === 'x' ? e.type === 'expense' : e.type === 'income') && e.status === v;
}

    && (f.category === 'all' || e.category === f.category)

    <input class="r-sum" maxlength="30" placeholder="項目，例如主持人費" value="${esc(r.summary)}" aria-label="固定支出項目">
    <select class="r-cat" aria-label="科目">${cats.map(c => `<option value="${esc(c)}"${c === r.category ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <input class="r-amt" inputmode="numeric" placeholder="每月金額" value="${r.amount ? money(r.amount) : ''}" aria-label="每月金額">
    <button type="button" class="chip-x r-del" aria-label="移除這項固定支出">×</button>
    <div class="r2">
      <span>從</span><input class="r-start" type="month" placeholder="2026-10" value="${esc(r.start)}" aria-label="開始月份">
      <span>到</span><input class="r-end" type="month" placeholder="可留空" value="${esc(r.end)}" aria-label="結束月份，可留空">
      <span>記入後</span><select class="r-st" aria-label="記入後的核銷狀態">${STATUS.expense.map(o => `<option value="${o.v}"${o.v === r.status ? ' selected' : ''}>${o.t}</option>`).join('')}</select>
    </div>
    <div class="err r-err"></div>
  </div>`;
}
function newRule() {
  const cats = settings().expenseCats;
  const endMonth = ($('#pEnd').value || '').slice(0, 7);
  const start = curMonth();
  return { id: 'r' + genId(), summary: '', category: cats.includes('人事費') ? '人事費' : cats[0], amount: 0, start, end: validMonth(endMonth) && endMonth >= start ? endMonth : '', status: 'unsubmitted', doneMonths: [] };
}
function readRules() {
  const latest = editingP ? (S.projects.find(x => x.id === editingP.id) || editingP) : null;
  const rules = [];
  let bad = null;
  $$('#pRec .rec-rule').forEach(row => {
    const summary = row.querySelector('.r-sum').value.trim();
    const amount = parseAmount(row.querySelector('.r-amt').value);
    const start = parseMonth(row.querySelector('.r-start').value);
    const endRaw = row.querySelector('.r-end').value.trim();
    const end = endRaw ? parseMonth(endRaw) : '';
    let msg = '';
    if (!summary) msg = '請填項目名稱，例如主持人費';
    else if (amount === null) msg = '請填每月金額（整數）';
    else if (!start) msg = '請填開始月份，例如 2026-10';
    else if (end === null) msg = '結束月份請寫成 2027-06 這樣，不限期可以留空';
    else if (end && end < start) msg = '結束月份要在開始月份之後';
    row.querySelector('.r-err').textContent = msg;
    if (msg && !bad) bad = row;
    const prev = latest && latest.recurring.find(r => r.id === row.dataset.rid);
    rules.push({ id: row.dataset.rid, summary: summary.slice(0, 30), category: row.querySelector('.r-cat').value, amount: amount || 0, start: start || '', end: end || '', status: row.querySelector('.r-st').value, doneMonths: prev ? prev.doneMonths.slice() : [] });
  });
  return { rules, bad };
}
function openProject(p) {
  if (!S.canWrite) return;
  editingP = p || null;
  $('#projTitle').textContent = p ? '編輯計畫' : '新增計畫';
  $('#pName').value = p ? p.name : '';
  $('#pCode').value = p ? p.code : '';
  $('#pSponsor').value = p ? p.sponsor : '';
  $('#pBudget').value = p && p.budget ? money(p.budget) : '';
  $('#pStatus').value = p ? p.status : 'active';
  $('#pStart').value = p ? p.start : '';
  $('#pEnd').value = p ? p.end : '';
  $('#pNote').value = p ? p.note : '';
  $('#pRec').innerHTML = (p ? p.recurring : []).map(ruleRowHtml).join('');
  ['pName', 'pBudget', 'pEnd'].forEach(id => setErr(id, ''));
  flash('pFlash', '');
  $('#pDelete').hidden = !p;
  const d = $('#projDlg');
  if (!d.open) d.showModal();
  setTimeout(() => $('#pName').focus(), 20);
}
async function saveProject() {
  if (!S.canWrite || savingP) return;
  const name = $('#pName').value.trim();
  const rawBudget = $('#pBudget').value.trim();
  const budget = rawBudget ? parseAmount(rawBudget, true) : 0;
  const start = $('#pStart').value, end = $('#pEnd').value;
  setErr('pName', name ? '' : '請填計畫名稱');
  setErr('pBudget', budget === null ? '請輸入整數金額，沒有核定經費可以留空' : '');
  setErr('pEnd', start && end && end < start ? '結束日期要在開始日期之後' : '');
  const bad = ['pName', 'pBudget', 'pEnd'].find(id => $('#' + id).getAttribute('aria-invalid') === 'true');
  if (bad) { $('#' + bad).focus(); return; }
  const rr = readRules();
  if (rr.bad) { rr.bad.querySelector('input').focus(); return; }
  const now = new Date().toISOString();
  const body = {
    name: name.slice(0, 120), budget,
    recurring: rr.rules,
    code: $('#pCode').value.trim().slice(0, 60),
    sponsor: $('#pSponsor').value.trim().slice(0, 120),
    status: $('#pStatus').value === 'closed' ? 'closed' : 'active',
    start: validDate(start) ? start : '',
    end: validDate(end) ? end : '',
    note: $('#pNote').value.trim().slice(0, 500),
    createdBy: editingP ? (editingP.createdBy || null) : (S.myId || null),
    createdAt: editingP ? (editingP.createdAt || now) : now,
    updatedAt: now
  };
  savingP = true;
  $('#pSave').disabled = true;
  flash('pFlash', '儲存中…');
  try {
    await Store.setDoc('projects', editingP ? editingP.id : null, body);
    flash('pFlash', '');
    $('#projDlg').close();
    toast('已儲存');
  } catch (err) {
    flash('pFlash', writeErrMsg(err), true);
  } finally {
    savingP = false;
    $('#pSave').disabled = false;
  }
}
async function deleteProject() {
  if (!editingP || !S.canWrite) return;
  const p = editingP;
  const n = S.entries.filter(e => e.projectId === p.id).length;
  const msg = n
    ? `要刪除計畫「${p.name}」嗎？有 ${n} 筆收支屬於這個計畫，刪除後它們會變成「不指定計畫」。如果只是計畫結束了，建議改成「已結案」就好。`
    : `要刪除計畫「${p.name}」嗎？刪除後無法復原。`;
  const ok = await confirmBox(msg, '刪除計畫');
  if (!ok) return;
  try { await Store.del('projects', p.id); $('#projDlg').close(); toast('已刪除'); }
  catch (err) { flash('pFlash', writeErrMsg(err), true); }
}

/* ---------- settings actions ---------- */
async function saveSettingsPatch(patch, okMsg) {
  if (!S.canWrite) return false;
  const st = settings();
  const body = Object.assign({ centerName: st.centerName, fiscalStart: st.fiscalStart, incomeCats: st.incomeCats, expenseCats: st.expenseCats }, patch);
  try { await Store.setSettings(body); toast(okMsg); return true; }
  catch (err) { toast(writeErrMsg(err)); return false; }
}
async function addCat(kind) {
  const input = kind === 'income' ? $('#incNew') : $('#expNew');
  const v = input.value.trim().slice(0, 20);
  if (!v) { input.focus(); return; }
  const st = settings();
  const key = kind === 'income' ? 'incomeCats' : 'expenseCats';
  if (st[key].includes(v)) { toast(`「${v}」已經在清單裡了`); return; }
  if (await saveSettingsPatch({ [key]: st[key].concat([v]) }, `已新增科目「${v}」`)) input.value = '';
}
async function removeCat(kind, cat) {
  const st = settings();
  const key = kind === 'income' ? 'incomeCats' : 'expenseCats';
  const next = st[key].filter(c => c !== cat);
  if (!next.length) return;
  await saveSettingsPatch({ [key]: next }, `已移除科目「${cat}」，既有紀錄不受影響`);
}

/* ---------- export ---------- */
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
async function exportCsv() {
  const rows = ledgerRows(), pm = projMap();
  if (!rows.length) { toast('目前沒有可匯出的紀錄'); return; }
  const head = ['日期', '類型', '計畫', '科目', '摘要', '收入', '支出', '經手人', '憑證編號', '狀態', '備註'];
  const lines = [head].concat(rows.map(e => [
    e.date, e.type === 'income' ? '收入' : '支出', (pm[e.projectId] || {}).name || '', e.category, e.summary,
    e.type === 'income' ? e.amount : '', e.type === 'expense' ? e.amount : '',
    e.handler, e.voucherNo, STATUS_TEXT[e.type][e.status], e.note
  ]));
  const csv = '\uFEFF' + lines.map(r => r.map(csvCell).join(',')).join('\r\n');
  const filename = `${settings().centerName}收支明細_${periodName().replace(/\s/g, '')}_${todayStr()}.csv`;
  if (DL) {
    try { await DL.save({ filename, data: csv }); toast('已匯出'); }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') return;
      toast(c === 'rate_limited' ? '已經有一個下載在等你確認，請稍後再試' : '這次無法匯出檔案');
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (err) { toast('這次無法匯出檔案'); }
}

/* ---------- navigation ---------- */
function switchView(v) {
  S.view = v;
  $$('.view').forEach(sec => { sec.hidden = sec.id !== 'view-' + v; });
  renderAll();
  window.scrollTo(0, 0);
}
function goLedger(patch, allPeriod) {
  S.filters = Object.assign({ type: 'all', project: 'all', category: 'all', status: 'all', q: '' }, patch);
  $('#fQ').value = S.filters.q;
  if (allPeriod) S.period = 'all';
  S.limit = PAGE;
  switchView('ledger');
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- events ---------- */
function bindUI() {
  $$('.tab').forEach(t => t.addEventListener('click', () => switchView(t.dataset.view)));
  $('#period').addEventListener('change', e => { S.period = e.target.value; S.limit = PAGE; renderAll(); });
  $('#addBtn').addEventListener('click', () => openEntry(null, { projectId: '' }));

  $('#fType').addEventListener('change', e => { S.filters.type = e.target.value; S.limit = PAGE; renderLedger(); });
  $('#fProject').addEventListener('change', e => { S.filters.project = e.target.value; S.limit = PAGE; renderLedger(); });
  $('#fCat').addEventListener('change', e => { S.filters.category = e.target.value; S.limit = PAGE; renderLedger(); });
  $('#fStatus').addEventListener('change', e => { S.filters.status = e.target.value; S.limit = PAGE; renderLedger(); });
  let qTimer = 0;
  $('#fQ').addEventListener('input', e => { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.filters.q = v; S.limit = PAGE; renderLedger(); }, 160); });
  $('#sortBtn').addEventListener('click', () => { S.sortAsc = !S.sortAsc; renderLedger(); });
  $('#moreBtn').addEventListener('click', () => { S.limit += PAGE; renderLedger(); });
  $('#exportBtn').addEventListener('click', exportCsv);
  const openRow = tr => { const e = S.entries.find(x => x.id === tr.dataset.id); if (e) openEntry(e); };
  $('#ledgerBody').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) openRow(tr); });
  $('#ledgerBody').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const tr = e.target.closest('tr.row'); if (tr) { e.preventDefault(); openRow(tr); } } });

  $$('[data-pf]').forEach(b => b.addEventListener('click', () => { S.projFilter = b.dataset.pf; renderProjects(); }));
  $('#addProj').addEventListener('click', () => openProject(null));

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a === 'go-open') goLedger({ type: el.dataset.type, status: 'open' });
    else if (a === 'view') switchView(el.dataset.view);
    else if (a === 'new-entry') openEntry(null, { projectId: '' });
    else if (a === 'new-project') openProject(null);
    else if (a === 'proj-ledger') goLedger({ project: el.dataset.pid }, true);
    else if (a === 'rec-do') recordDue(el.dataset.pid, el.dataset.rid, false);
    else if (a === 'rec-skip') recordDue(el.dataset.pid, el.dataset.rid, true);
    else if (a === 'add-to-project') openEntry(null, { type: el.dataset.type === 'income' ? 'income' : 'expense', projectId: el.dataset.pid });
    else if (a === 'edit-project') { const p = S.projects.find(x => x.id === el.dataset.pid); if (p) openProject(p); }
    else if (a === 'cat-ledger') goLedger(el.dataset.cat ? { type: 'expense', category: el.dataset.cat } : { type: 'expense' });
    else if (a === 'clear-filters') goLedger({});
    else if (a === 'add-cat') addCat(el.dataset.kind);
    else if (a === 'rm-cat') removeCat(el.dataset.kind, el.dataset.cat);
  });

  $$('.typeseg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.t === curType) return;
    setType(b.dataset.t, last.cat[b.dataset.t]);
    renderStatus(b.dataset.t, b.dataset.t === 'income' ? 'done' : 'unsubmitted');
  }));
  $('#entryForm').addEventListener('submit', e => { e.preventDefault(); saveEntry(false); });
  $('#eSaveNext').addEventListener('click', () => saveEntry(true));
  $('#eCancel').addEventListener('click', () => $('#entryDlg').close());
  $('#eDelete').addEventListener('click', deleteEntry);
  $('#eAmount').addEventListener('blur', e => { const n = parseAmount(e.target.value); if (n !== null) e.target.value = money(n); });
  $('#pBudget').addEventListener('blur', e => { const n = parseAmount(e.target.value, true); if (n !== null) e.target.value = money(n); });

  $('#projForm').addEventListener('submit', e => { e.preventDefault(); saveProject(); });
  $('#pCancel').addEventListener('click', () => $('#projDlg').close());
  $('#pDelete').addEventListener('click', deleteProject);
  $('#pRecAdd').addEventListener('click', () => {
    $('#pRec').insertAdjacentHTML('beforeend', ruleRowHtml(newRule()));
    const rows = $$('#pRec .rec-rule');
    rows[rows.length - 1].querySelector('.r-sum').focus();
  });
  $('#pRec').addEventListener('click', e => { const b = e.target.closest('.r-del'); if (b) b.closest('.rec-rule').remove(); });
  $('#pRec').addEventListener('focusout', e => {
    if (e.target.classList.contains('r-amt')) { const n = parseAmount(e.target.value); if (n !== null) e.target.value = money(n); }
  });

  $('#sName').addEventListener('input', e => { e.target.dataset.dirty = '1'; });
  $$('input[name="sFiscal"]').forEach(r => r.addEventListener('change', () => { $('#basicFields').dataset.dirty = '1'; }));
  $('#saveBasics').addEventListener('click', async () => {
    const name = $('#sName').value.trim().slice(0, 30);
    if (!name) { toast('請填中心名稱'); $('#sName').focus(); return; }
    const r = $('input[name="sFiscal"]:checked');
    const ok = await saveSettingsPatch({ centerName: name, fiscalStart: r && r.value === '8' ? 8 : 1 }, '已儲存');
    if (ok) {
      delete $('#sName').dataset.dirty;
      delete $('#basicFields').dataset.dirty;
      S.period = null;
      renderAll();
    }
  });
  let rTimer = 0, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(rTimer);
    rTimer = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (S.view === 'overview') renderOverview(); } }, 200);
  });
  $('#incNew').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCat('income'); } });
  $('#expNew').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCat('expense'); } });
  $$('input[name="sDate"]').forEach(r => r.addEventListener('change', () => {
    S.dateStyle = r.value === 'ad' ? 'ad' : 'roc';
    try { localStorage.setItem(PREF_DATE, S.dateStyle); } catch (e) {}
    renderAll();
  }));
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
</body>
</html>
